server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:h2:file:./data/bakerydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: http://localhost:4200,http://192.168.100.*:4200
  jwt:
    secret: "bakery-dev-secret-key-change-me-before-production-0123456789"
    expiration-ms: 86400000
  ocr:
    # Per-machine — override with the TESSDATA_PATH env var on any machine other than this one
    # (e.g. macOS Homebrew installs typically use /opt/homebrew/share/tessdata or /usr/local/share/tessdata).
    tessdata-path: "${TESSDATA_PATH:C:/Users/Public.DESKTOP-3A1LBHM/AppData/Local/Programs/Tesseract-OCR/tessdata}"

lalamove:
  # No /v3 suffix here — LalamoveClient's paths (e.g. "/v3/quotations") already include it, and
  # the HMAC signature is computed over that exact path, so a doubled "/v3/v3/..." here would
  # both hit the wrong URL and break signature verification (401).
  base-url: "https://rest.sandbox.lalamove.com"
  market: PH
  # Read from the LALAMOVE_API_KEY / LALAMOVE_API_SECRET environment variables — never put the
  # real values directly in this file, it's tracked in a public git repo.
  api-key: "${LALAMOVE_API_KEY:}"
  api-secret: "${LALAMOVE_API_SECRET:}"
  default-service-type: "MOTORCYCLE"
  language: "en_PH"

google:
  # Read from GOOGLE_MAPS_API_KEY — same reasoning as above.
  maps-api-key: "${GOOGLE_MAPS_API_KEY:}"
